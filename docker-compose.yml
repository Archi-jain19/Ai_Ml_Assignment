services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facetlens-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SCORING_MODEL=${SCORING_MODEL:-llama-3.1-8b-instant}
      - TOP_K=${TOP_K:-20}
      - BATCH_SIZE=${BATCH_SIZE:-5}
      - PYTHONPATH=/app
      - HF_HOME=/app/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/sentence_transformers
    volumes:
      - hf-cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facetlens-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  hf-cache:
    name: facetlens_hf_cache
